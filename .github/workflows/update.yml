name: Update grid data

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may delay scheduled runs)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Grid-India and Vidyut Pravah refuse connections from GitHub's US-hosted
  # runners. To fetch from a machine in India, register a self-hosted runner
  # there and set the repository variable FETCH_RUNNER to its label
  # (see README). Without it this job runs on GitHub and the site shows the model.
  fetch:
    runs-on: ${{ vars.FETCH_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: python -m pip install -r fetcher/requirements.txt

      # Start from the published data so a failed source keeps its last good
      # values and the day's PSP report is not re-downloaded every run.
      - name: Restore previous data
        run: curl -fsS "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/latest.json" -o data/latest.json || echo "no previous data"

      - name: Fetch
        run: python fetcher/fetch.py

      - uses: actions/upload-artifact@v7
        with:
          name: latest
          path: data/latest.json
          if-no-files-found: ignore
          retention-days: 1

  deploy:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: latest
          path: data
        continue-on-error: true

      - uses: actions/configure-pages@v6

      - name: Build site
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/india-map.json _site/data/
          if [ -f data/latest.json ]; then cp data/latest.json _site/data/; fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v5
