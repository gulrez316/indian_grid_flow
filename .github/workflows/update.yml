name: Update grid data

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may delay scheduled runs)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fetcher/requirements.txt

      - run: pip install -r fetcher/requirements.txt

      - id: pages
        uses: actions/configure-pages@v5

      # Start from the currently published data so a failed source keeps its last
      # good values and the daily PSP report is not re-downloaded every run.
      - name: Restore previous data
        run: curl -fsS "${{ steps.pages.outputs.base_url }}/data/latest.json" -o data/latest.json || echo "no previous data"

      - name: Fetch
        run: python fetcher/fetch.py

      - name: Build site
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/india-map.json data/latest.json _site/data/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
